<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Pass QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(to right, #f7f8fc, #e3e6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 25px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 420px;
    width: 100%;
    text-align: center;
}

.logo-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 15px;
}

.logo { width: 110px; }

h2 { margin-bottom: 15px; font-size: 1.3rem; }

.lang-switch {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.lang-switch button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: #f8f9fa;
    cursor: pointer;
}

.lang-switch button.active {
    background: #007bff;
    color: white;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

#reader {
    margin: 15px 0;
    border-radius: 10px;
    overflow: hidden;
    background: #fafafa;
}

.preferred-amounts {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 10px;
}

.preferred-amounts button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    cursor: pointer;
}

.pay-btn {
    background: #28a745;
    color: white;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    font-size: 1.1rem;
}

.action-btn {
    background: #00b2ff;
    color: white;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
    font-weight: bold;
}

button:disabled {
    background: #ccc !important;
    cursor: not-allowed;
}

#status {
    margin-top: 15px;
    min-height: 40px;
    font-size: 14px;
}

body.fade-out {
    animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
    to { opacity: 0; transform: scale(0.98); }
}
</style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <img src="static/coffeewaylogo.png" class="logo">
        <img src="static/clicklogo.png" class="logo">
    </div>

    <h2 id="title">Scan Click Pass QR</h2>

    <div class="lang-switch">
        <button id="btn-uz" onclick="setLanguage('uz')">🇺🇿 O'zbek</button>
        <button id="btn-ru" onclick="setLanguage('ru')">🇷🇺 Русский</button>
    </div>

    <input id="amount" type="number" placeholder="Amount (UZS)">

    <div class="preferred-amounts">
        <button onclick="setAmount(23000)">23000</button>
        <button onclick="setAmount(28000)">28000</button>
        <button onclick="setAmount(33000)">33000</button>
        <button onclick="setAmount(38000)">38000</button>
    </div>

    <input id="desc" placeholder="Description">
    <input id="token" placeholder="QR Token Result" maxlength="20">

    <div id="reader"></div>

    <button class="pay-btn" id="payBtn" onclick="pay()">Pay</button>
    <button class="action-btn" id="startBtn" onclick="startCamera()">Start Camera</button>

    <p id="status"></p>
</div>

<script>
let qr = null;
let cameraRunning = false;
let locked = false;
let lang = 'uz';

const t = {
    uz: {
        title: "Click Pass QR kodini skanerlash",
        start: "Kamerani yoqish",
        pay: "To‘lash",
        enterAmount: "❌ Summani kiriting",
        noToken: "❌ QR token topilmadi",
        scanning: "🔍 Skanerlanmoqda...",
        processing: "⏳ To'lov amalga oshirilmoqda...",
        success: "✅ To'lov muvaffaqiyatli yakunlandi!",
        failed: "❌ To'lov amalga oshmadi",
        noCamera: "❌ Kamera topilmadi",
        clickToStart: "📷 Kamerani yoqing"
    },
    ru: {
        title: "Сканирование QR Click Pass",
        start: "Запустить камеру",
        pay: "Оплатить",
        enterAmount: "❌ Введите сумму",
        noToken: "❌ QR токен не найден",
        scanning: "🔍 Сканирование...",
        processing: "⏳ Обработка платежа...",
        success: "✅ Платеж прошел успешно!",
        failed: "❌ Платеж не выполнен",
        noCamera: "❌ Камера не найдена",
        clickToStart: "📷 Запустите камеру"
    }
};

function setLanguage(l) {
    lang = l;
    document.getElementById('title').innerText = t[l].title;
    document.getElementById('payBtn').innerText = t[l].pay;
    document.getElementById('startBtn').innerText = t[l].start;
    document.getElementById('status').innerText = t[l].clickToStart;
    btnUz.classList.toggle('active', l === 'uz');
    btnRu.classList.toggle('active', l === 'ru');
}

function startCamera() {
    if (cameraRunning || locked) return;

    qr = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(devices => {
        if (!devices.length) {
            status.innerText = t[lang].noCamera;
            return;
        }

        qr.start(devices[0].id, { fps: 10, qrbox: 250 }, text => {
            if (text.length === 20 && !locked) processScan(text);
        }).then(() => {
            cameraRunning = true;
            status.innerText = t[lang].scanning;
        });
    });
}

function processScan(tokenValue) {
    locked = true;
    token.value = tokenValue;

    qr?.stop().then(() => cameraRunning = false);
    pay();
}

function pay() {
    if (!amount.value) { status.innerText = t[lang].enterAmount; locked = false; return; }
    if (!token.value) { status.innerText = t[lang].noToken; locked = false; return; }

    status.innerText = t[lang].processing;
    payBtn.disabled = startBtn.disabled = true;

    fetch('/pay', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            token: token.value,
            amount: amount.value,
            description: desc.value
        })
    })
    .then(r => r.json())
    .then(r => {
        if (r.status === 'success') {
            status.innerText = t[lang].success;
            setTimeout(() => {
                document.body.classList.add('fade-out');
                setTimeout(() => location.reload(), 1000);
            }, 1500);
        } else reset(r.message);
    })
    .catch(() => reset());
}

function reset(msg) {
    status.innerText = t[lang].failed + (msg ? `: ${msg}` : '');
    locked = false;
    payBtn.disabled = startBtn.disabled = false;
}

function setAmount(v){ amount.value = v; }

token.addEventListener('input', e => {
    if (e.target.value.length === 20 && !locked) processScan(e.target.value);
});

setLanguage('uz');
</script>

</body>
</html>
