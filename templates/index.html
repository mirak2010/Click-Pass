<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click Pass Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #f7f8fc, #e3e6f0);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }
    .container {
      background: white;
      padding: 25px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 140px;
      margin-bottom: 10px;
    }
    h2 { margin-top: 0; margin-bottom: 15px; color: #333; }
    .lang-switch { display: flex; justify-content: center; margin-bottom: 20px; }
    .lang-switch button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background: #f0f0f0;
      color: #333;
      margin: 0 5px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .lang-switch button.active { background: #007bff; color: white; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    #reader { width: 100%; max-width: 300px; margin: 0 auto; border: 1px solid #ccc; border-radius: 10px; }
    button.action-btn, button.pay-btn {
      padding: 12px 20px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; width: 100%; transition: background 0.3s;
    }
    button.action-btn { background: #00b2ff; color: white; }
    button.action-btn:hover { background: #0090d4; }
    button.pay-btn { background: #28a745; color: white; }
    button.pay-btn:hover { background: #218838; }
    #status { margin-top: 15px; font-size: 14px; color: #444; min-height: 20px; }
    #animation-box { margin-top: 20px; height: 100px; }
    .preferred-amounts button {
      background: #f0f0f0; border: 1px solid #ccc; margin: 4px; padding: 8px 14px; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.3s;
    }
    .preferred-amounts button:hover { background: #d9eaff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="{{ url_for('static', filename='coffeewaylogo.png') }}" alt="Coffee Way Logo" class="logo">
      <img src="{{ url_for('static', filename='clicklogo.png') }}" alt="Click Logo" class="logo">
    </div>
    <h2 id="title">Scan Payme GO QR</h2>

    <div class="lang-switch">
      <button id="btn-uz" onclick="setLanguage('uz')">🇺🇿 O'zbek</button>
      <button id="btn-ru" onclick="setLanguage('ru')">🇷🇺 Русский</button>
    </div>

    <form id="payment-form">
      <input type="number" step="0.01" id="amount" placeholder="Amount (UZS)" required>

      <div class="preferred-amounts" style="margin: 10px 0;">
        <div>
          <button type="button" onclick="setPreferredAmount(23000)">23000</button>
          <button type="button" onclick="setPreferredAmount(28000)">28000</button>
          <button type="button" onclick="setPreferredAmount(33000)">33000</button>
          <button type="button" onclick="setPreferredAmount(38000)">38000</button>
        </div>
      </div>

      <input type="text" id="desc" placeholder="Description">
      <input type="text" id="gun-scanner-input" placeholder="Gun Scanner Input" readonly>
      <div id="reader"></div>

      <button type="button" class="pay-btn" onclick="handlePayment()" id="pay-btn">Pay</button>
      <button type="button" class="action-btn" onclick="startCamera()" id="start-btn">Start Camera</button>

      <p id="status">Click "Start Camera" to begin scanning.</p>
      <div id="animation-box"></div>
    </form>
  </div>

  <script>
    let scanner = null;
    let isCameraRunning = false;
    let currentLang = 'uz';

    const translations = {
      uz: {
        title: "Click Pass QR kodini skanerlash",
        amount: "Summani kiriting (UZS)",
        desc: "Izoh",
        gunScanner: "Skaneri resultati",
        start: "Kamerani yoqish",
        pay: "To‘lash",
        clickToStart: "📷 QR kodni skanerlash uchun 'Kamerani yoqish' tugmasini bosing.",
        alreadyRunning: "⚠️ Kamera allaqan ishlayapti.",
        noCamera: "❌ Kamera topilmadi.",
        scannedReady: "QR kod skanerladi! To‘lov amalga oshirilmoqda...",
        processing: "⏳ To'lov amalga oshirilmoqda...",
        success: "✅ To'lov muvaffaqiyatli yakunlandi!",
        failed: "❌ To'lov amalga oshmadi",
        enterAmount: "❌ Iltimos, summani kiriting.",
        networkError: "❌ Tarmoq xatosi"
      },
      ru: {
        title: "Сканируйте QR Click Pass",
        amount: "Введите сумму (UZS)",
        desc: "Описание",
        gunScanner: "Сканер штрихкода",
        start: "Запустить камеру",
        pay: "Оплатить",
        clickToStart: "📷 Нажмите 'Запустить камеру' для сканирования QR-кода.",
        alreadyRunning: "⚠️ Камера уже активна.",
        noCamera: "❌ Камеры не найдены.",
        scannedReady: "QR код сканирован! Обработка платежа...",
        processing: "⏳ Обработка платежа...",
        success: "✅ Платеж прошел успешно!",
        failed: "❌ Платеж не выполнен",
        enterAmount: "❌ Пожалуйста, введите сумму.",
        networkError: "❌ Ошибка сети"
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.getElementById('title').innerText = t.title;
      document.getElementById('amount').placeholder = t.amount;
      document.getElementById('desc').placeholder = t.desc;
      document.getElementById('gun-scanner-input').placeholder = t.gunScanner;
      document.getElementById('start-btn').innerText = t.start;
      document.getElementById('pay-btn').innerText = t.pay;
      document.getElementById('status').innerText = t.clickToStart;
      document.getElementById('btn-uz').classList.toggle('active', lang === 'uz');
      document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
    }

    function startCamera() {
      const t = translations[currentLang];
      const status = document.getElementById('status');

      if (isCameraRunning) {
        status.innerText = t.alreadyRunning;
        return;
      }

      scanner = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(devices => {
        if (!devices || devices.length === 0) {
          status.innerText = t.noCamera;
          return;
        }

        const cameraId = devices[0].id;

        scanner.start(
          cameraId,
          { fps: 10, qrbox: 250 },
          (decodedText) => {
            // Stop camera after scan
            if (scanner) {
              scanner.stop().then(() => { isCameraRunning = false; }).catch(() => {});
            }

            document.getElementById("gun-scanner-input").value = decodedText;
            status.innerText = translations[currentLang].scannedReady;

            // Automatically trigger payment
            handlePayment();
          }
        ).then(() => {
          isCameraRunning = true;
        }).catch(err => {
          status.innerText = `${t.networkError}: ${err}`;
        });

      }).catch(err => {
        status.innerText = `${t.networkError}: ${err}`;
      });
    }

    function handlePayment() {
      const t = translations[currentLang];
      const amountInput = document.getElementById("amount").value.trim();
      const desc = document.getElementById("desc").value.trim();
      const token = document.getElementById("gun-scanner-input").value.trim();

      if (!amountInput) {
        document.getElementById("status").innerText = t.enterAmount;
        return;
      }

      const amount = parseFloat(amountInput);
      if (!token) {
        document.getElementById("status").innerText = "❌ QR token not found.";
        return;
      }

      document.getElementById("status").innerText = t.processing;

      fetch("/pay", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, amount, description: desc })
      })
      .then(async res => {
        let data = {};
        try {
          data = await res.json();
        } catch {
          document.getElementById("status").innerText = t.failed + ": Invalid server response";
          return;
        }

        const msg = data.message || JSON.stringify(data) || res.statusText;

        if (res.ok && data.status === "success") {
          document.getElementById("status").innerText = t.success;
          setTimeout(() => {
            document.body.classList.add("fade-out");
            setTimeout(() => location.reload(), 1000);
          }, 1500);
        } else {
          document.getElementById("status").innerText = `${t.failed}: ${msg}`;
        }
      })
      .catch(err => {
        document.getElementById("status").innerText = `${t.networkError}: ${err.message}`;
      });
    }

    function setPreferredAmount(value) {
      document.getElementById('amount').value = value;
    }

    // Trigger payment on Enter key in token input
    document.getElementById('gun-scanner-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handlePayment();
      }
    });

    // Default language
    setLanguage('uz');
  </script>

</body>
</html>
